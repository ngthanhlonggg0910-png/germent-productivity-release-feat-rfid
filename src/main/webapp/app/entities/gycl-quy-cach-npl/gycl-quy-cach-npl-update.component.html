<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-gycl-quy-cach-npl-heading" jhiTranslate="ctApp.gYCLQuyCachNPL.home.createOrEditLabel">Create or edit a GYCL Quy Cach NPL</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.tenNPL" for="field_tenNPL">Ten NPL</label>
                    <input type="text" class="form-control" name="tenNPL" id="field_tenNPL"
                           formControlName="tenNPL"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.nguoiTao" for="field_nguoiTao">Nguoi Tao</label>
                    <input type="text" class="form-control" name="nguoiTao" id="field_nguoiTao"
                           formControlName="nguoiTao"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.ngayTao" for="field_ngayTao">Ngay Tao</label>
                    <div class="d-flex">
                        <input id="field_ngayTao" type="datetime-local" class="form-control" name="ngayTao" formControlName="ngayTao" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.userId" for="field_userId">User Id</label>
                    <input type="number" class="form-control" name="userId" id="field_userId"
                           formControlName="userId"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.yesNo" for="field_yesNo">Yes No</label>
                    <input type="checkbox" class="form-control" name="yesNo" id="field_yesNo"
                           formControlName="yesNo"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.nA" for="field_nA">N A</label>
                    <input type="text" class="form-control" name="nA" id="field_nA"
                           formControlName="nA"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.gYCLQuyCachNPL.proGopYChatLuong" for="field_proGopYChatLuong">Pro Gop Y Chat Luong</label>
                    <select class="form-control" id="field_proGopYChatLuong" name="proGopYChatLuong" formControlName="proGopYChatLuongId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="gopYChatLuongOption.id" *ngFor="let gopYChatLuongOption of gopychatluongs; trackBy: trackGopYChatLuongById">{{gopYChatLuongOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
