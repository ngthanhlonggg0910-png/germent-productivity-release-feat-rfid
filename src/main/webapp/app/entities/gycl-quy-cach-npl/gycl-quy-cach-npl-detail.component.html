<div class="row justify-content-center">

            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.tenNPL">Ten NPL</span></dt>
                <dd>
                    <span>{{gYCLQuyCachNPL.tenNPL}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.nguoiTao">Nguoi Tao</span></dt>
                <dd>
                    <span>{{gYCLQuyCachNPL.nguoiTao}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.ngayTao">Ngay Tao</span></dt>
                <dd>
                    <span>{{gYCLQuyCachNPL.ngayTao}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.userId">User Id</span></dt>
                <dd>
                    <span>{{gYCLQuyCachNPL.userId}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.yesNo">Yes No</span></dt>

                    <span>{{gYCLQuyCachNPL.yesNo}}</span>

                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.nA">N A</span></dt>

                <dt><span jhiTranslate="ctApp.gYCLQuyCachNPL.proGopYChatLuong">Pro Gop Y Chat Luong</span></dt>
