<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="nVButtonTrackingType">
            <h2><span jhiTranslate="ctApp.nVButtonTrackingType.detail.title">NV Button Tracking Type</span> {{nVButtonTrackingType.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.nVButtonTrackingType.name">Name</span></dt>
                <dd>
                    <span>{{nVButtonTrackingType.name}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.nVButtonTrackingType.numberOfState">Number Of State</span></dt>
                <dd>
                    <span>{{nVButtonTrackingType.numberOfState}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/nv-button-tracking-type', nVButtonTrackingType.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
