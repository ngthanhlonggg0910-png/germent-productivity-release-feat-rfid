<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-sys-file-heading" jhiTranslate="ctApp.sysFile.home.createOrEditLabel">Create or edit a Sys File</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFile.fileName" for="field_fileName">File Name</label>
                    <input type="text" class="form-control" name="fileName" id="field_fileName"
                           formControlName="fileName"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFile.fileUri" for="field_fileUri">File Uri</label>
                    <input type="text" class="form-control" name="fileUri" id="field_fileUri"
                           formControlName="fileUri"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFile.fileExtension" for="field_fileExtension">File Extension</label>
                    <input type="text" class="form-control" name="fileExtension" id="field_fileExtension"
                           formControlName="fileExtension"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFile.size" for="field_size">Size</label>
                    <input type="number" class="form-control" name="size" id="field_size"
                           formControlName="size"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFile.uploadedAt" for="field_uploadedAt">Uploaded At</label>
                    <div class="d-flex">
                        <input id="field_uploadedAt" type="datetime-local" class="form-control" name="uploadedAt" formControlName="uploadedAt" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
