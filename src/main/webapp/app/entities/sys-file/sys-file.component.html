<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.sysFile.home.title">Sys Files</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-sys-file" [routerLink]="['/sys/sys-file/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.sysFile.home.createLabel">
            Create a new Sys File
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="sysFiles?.length === 0">
        <span jhiTranslate="ctApp.sysFile.home.notFound">No sysFiles found</span>
    </div>
    <div class="table-responsive" *ngIf="sysFiles?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="fileName"><span jhiTranslate="ctApp.sysFile.fileName">File Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="fileUri"><span jhiTranslate="ctApp.sysFile.fileUri">File Uri</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="fileExtension"><span jhiTranslate="ctApp.sysFile.fileExtension">File Extension</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="size"><span jhiTranslate="ctApp.sysFile.size">Size</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="uploadedAt"><span jhiTranslate="ctApp.sysFile.uploadedAt">Uploaded At</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let sysFile of sysFiles ;trackBy: trackId">
                <td><a [routerLink]="['/sys/sys-file', sysFile.id, 'view' ]">{{sysFile.id}}</a></td>
                <td>{{sysFile.fileName}}</td>
                <td>{{sysFile.fileUri}}</td>
                <td>{{sysFile.fileExtension}}</td>
                <td>{{sysFile.size}}</td>
                <td>{{sysFile.uploadedAt | date:'medium'}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/sys-file', sysFile.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-file', sysFile.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-file', { outlets: { popup: sysFile.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="sysFiles?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
