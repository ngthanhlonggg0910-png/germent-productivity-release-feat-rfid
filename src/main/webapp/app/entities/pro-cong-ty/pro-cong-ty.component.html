<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proCongTy.home.title">Pro Cong Ties</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-cong-ty" [routerLink]="['/sys/pro-cong-ty/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proCongTy.home.createLabel">
            Create a new Pro Cong Ty
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proCongTies?.length === 0">
        <span jhiTranslate="ctApp.proCongTy.home.notFound">No proCongTies found</span>
    </div>
    <div class="table-responsive" *ngIf="proCongTies?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ten"><span jhiTranslate="ctApp.proCongTy.ten">Ten</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="diaChi"><span jhiTranslate="ctApp.proCongTy.diaChi">Dia Chi</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="mst"><span jhiTranslate="ctApp.proCongTy.mst">Mst</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proCongTy of proCongTies ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-cong-ty', proCongTy.id, 'view' ]">{{proCongTy.id}}</a></td>
                <td>{{proCongTy.ten}}</td>
                <td>{{proCongTy.diaChi}}</td>
                <td>{{proCongTy.mst}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-ty', proCongTy.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-ty', proCongTy.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-ty', { outlets: { popup: proCongTy.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proCongTies?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
