<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proCongTy">
            <h2><span jhiTranslate="ctApp.proCongTy.detail.title">Pro Cong Ty</span> {{proCongTy.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proCongTy.ten">Ten</span></dt>
                <dd>
                    <span>{{proCongTy.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proCongTy.diaChi">Dia Chi</span></dt>
                <dd>
                    <span>{{proCongTy.diaChi}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proCongTy.mst">Mst</span></dt>
                <dd>
                    <span>{{proCongTy.mst}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-cong-ty', proCongTy.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
