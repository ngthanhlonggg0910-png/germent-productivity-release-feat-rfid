<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.buttonTracking.home.title">Button Trackings</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-button-tracking" [routerLink]="['/sys/button-tracking/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.buttonTracking.home.createLabel">
            Create a new Button Tracking
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="buttonTrackings?.length === 0">
        <span jhiTranslate="ctApp.buttonTracking.home.notFound">No buttonTrackings found</span>
    </div>
    <div class="table-responsive" *ngIf="buttonTrackings?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="updateDate"><span jhiTranslate="ctApp.buttonTracking.updateDate">Update Date</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="currentAliasState"><span jhiTranslate="ctApp.buttonTracking.currentAliasState">Current Alias State</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="trackingId"><span jhiTranslate="ctApp.buttonTracking.trackingId">Tracking Id</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let buttonTracking of buttonTrackings ;trackBy: trackId">
                <td><a [routerLink]="['/sys/button-tracking', buttonTracking.id, 'view' ]">{{buttonTracking.id}}</a></td>
                <td>{{buttonTracking.updateDate | date:'medium'}}</td>
                <td>{{buttonTracking.currentAliasState}}</td>
                <td>{{buttonTracking.trackingId}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/button-tracking', buttonTracking.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/button-tracking', buttonTracking.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/button-tracking', { outlets: { popup: buttonTracking.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="buttonTrackings?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
