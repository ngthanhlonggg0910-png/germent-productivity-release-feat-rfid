<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-sys-function-heading" jhiTranslate="ctApp.sysFunction.home.createOrEditLabel">Create or edit a Sys Function</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.name" for="field_name">Name</label>
                    <input type="text" class="form-control" name="name" id="field_name"
                           formControlName="name"/>
                    <div *ngIf="editForm.get('name').invalid && (editForm.get('name').dirty || editForm.get('name').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('name').errors.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('name').errors.maxlength" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: 100 }">
                        This field cannot be longer than 100 characters.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.caption" for="field_caption">Caption</label>
                    <input type="text" class="form-control" name="caption" id="field_caption"
                           formControlName="caption"/>
                    <div *ngIf="editForm.get('caption').invalid && (editForm.get('caption').dirty || editForm.get('caption').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('caption').errors.maxlength" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: 255 }">
                        This field cannot be longer than 255 characters.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.level" for="field_level">Level</label>
                    <input type="number" class="form-control" name="level" id="field_level"
                           formControlName="level"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.imageUri" for="field_imageUri">Image Uri</label>
                    <input type="text" class="form-control" name="imageUri" id="field_imageUri"
                           formControlName="imageUri"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.eventName" for="field_eventName">Event Name</label>
                    <input type="text" class="form-control" name="eventName" id="field_eventName"
                           formControlName="eventName"/>
                    <div *ngIf="editForm.get('eventName').invalid && (editForm.get('eventName').dirty || editForm.get('eventName').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('eventName').errors.maxlength" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: 50 }">
                        This field cannot be longer than 50 characters.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.hotkey" for="field_hotkey">Hotkey</label>
                    <input type="text" class="form-control" name="hotkey" id="field_hotkey"
                           formControlName="hotkey"/>
                    <div *ngIf="editForm.get('hotkey').invalid && (editForm.get('hotkey').dirty || editForm.get('hotkey').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('hotkey').errors.maxlength" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: 5 }">
                        This field cannot be longer than 5 characters.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.sysPermission" for="field_sysPermission">Sys Permission</label>
                    <select class="form-control" id="field_sysPermission" name="sysPermission" formControlName="sysPermissionId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="sysPermissionOption.id" *ngFor="let sysPermissionOption of syspermissions; trackBy: trackSysPermissionById">{{sysPermissionOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysFunction.sysModule" for="field_sysModule">Sys Module</label>
                    <select class="form-control" id="field_sysModule" name="sysModule" formControlName="sysModuleId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="sysModuleOption.id" *ngFor="let sysModuleOption of sysmodules; trackBy: trackSysModuleById">{{sysModuleOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
