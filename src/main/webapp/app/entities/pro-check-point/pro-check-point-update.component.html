<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-check-point-heading" jhiTranslate="ctApp.proCheckPoint.home.createOrEditLabel">Create or edit a Pro Check Point</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCheckPoint.ten" for="field_ten">Ten</label>
                    <input type="text" class="form-control" name="ten" id="field_ten"
                           formControlName="ten"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCheckPoint.proChuyen" for="field_proChuyen">Pro Chuyen</label>
                    <select class="form-control" id="field_proChuyen" name="proChuyen" formControlName="proChuyenId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proChuyenOption.id" *ngFor="let proChuyenOption of prochuyens; trackBy: trackProChuyenById">{{proChuyenOption.ten}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCheckPoint.proCongDoan" for="field_proCongDoan">Pro Cong Doan</label>
                    <select class="form-control" id="field_proCongDoan" name="proCongDoan" formControlName="proCongDoanId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proCongDoanOption.id" *ngFor="let proCongDoanOption of procongdoans; trackBy: trackProCongDoanById">{{proCongDoanOption.ten}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
