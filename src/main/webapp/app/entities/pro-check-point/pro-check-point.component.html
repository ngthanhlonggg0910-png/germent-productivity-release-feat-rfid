<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proCheckPoint.home.title">Pro Check Points</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-check-point" [routerLink]="['/sys/pro-check-point/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proCheckPoint.home.createLabel">
            Create a new Pro Check Point
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proCheckPoints?.length === 0">
        <span jhiTranslate="ctApp.proCheckPoint.home.notFound">No proCheckPoints found</span>
    </div>
    <div class="table-responsive" *ngIf="proCheckPoints?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ten"><span jhiTranslate="ctApp.proCheckPoint.ten">Ten</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proChuyenTen"><span jhiTranslate="ctApp.proCheckPoint.proChuyen">Pro Chuyen</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proCongDoanTen"><span jhiTranslate="ctApp.proCheckPoint.proCongDoan">Pro Cong Doan</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proCheckPoint of proCheckPoints ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-check-point', proCheckPoint.id, 'view' ]">{{proCheckPoint.id}}</a></td>
                <td>{{proCheckPoint.ten}}</td>
                <td>
                    <div *ngIf="proCheckPoint.proChuyenId">
                        <a [routerLink]="['/sys/pro-chuyen', proCheckPoint.proChuyenId , 'view' ]" >{{proCheckPoint.proChuyenTen}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="proCheckPoint.proCongDoanId">
                        <a [routerLink]="['/sys/pro-cong-doan', proCheckPoint.proCongDoanId , 'view' ]" >{{proCheckPoint.proCongDoanTen}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-check-point', proCheckPoint.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-check-point', proCheckPoint.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-check-point', { outlets: { popup: proCheckPoint.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proCheckPoints?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
