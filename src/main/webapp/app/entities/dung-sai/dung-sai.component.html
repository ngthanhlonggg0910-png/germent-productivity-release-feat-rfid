<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.dungSai.home.title">Dung Sais</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-dung-sai" [routerLink]="['/sys/dung-sai/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.dungSai.home.createLabel">
            Create a new Dung Sai
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="dungSais?.length === 0">
        <span jhiTranslate="ctApp.dungSai.home.notFound">No dungSais found</span>
    </div>
    <div class="table-responsive" *ngIf="dungSais?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="cmLabel"><span jhiTranslate="ctApp.dungSai.cmLabel">Cm Label</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="inchLabel"><span jhiTranslate="ctApp.dungSai.inchLabel">Inch Label</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="cmValue"><span jhiTranslate="ctApp.dungSai.cmValue">Cm Value</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="inchValue"><span jhiTranslate="ctApp.dungSai.inchValue">Inch Value</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let dungSai of dungSais ;trackBy: trackId">
                <td><a [routerLink]="['/sys/dung-sai', dungSai.id, 'view' ]">{{dungSai.id}}</a></td>
                <td>{{dungSai.cmLabel}}</td>
                <td>{{dungSai.inchLabel}}</td>
                <td>{{dungSai.cmValue}}</td>
                <td>{{dungSai.inchValue}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/dung-sai', dungSai.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/dung-sai', dungSai.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/dung-sai', { outlets: { popup: dungSai.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="dungSais?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
