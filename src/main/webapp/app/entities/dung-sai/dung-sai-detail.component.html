<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="dungSai">
            <h2><span jhiTranslate="ctApp.dungSai.detail.title">Dung Sai</span> {{dungSai.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.dungSai.cmLabel">Cm Label</span></dt>
                <dd>
                    <span>{{dungSai.cmLabel}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.dungSai.inchLabel">Inch Label</span></dt>
                <dd>
                    <span>{{dungSai.inchLabel}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.dungSai.cmValue">Cm Value</span></dt>
                <dd>
                    <span>{{dungSai.cmValue}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.dungSai.inchValue">Inch Value</span></dt>
                <dd>
                    <span>{{dungSai.inchValue}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/dung-sai', dungSai.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
