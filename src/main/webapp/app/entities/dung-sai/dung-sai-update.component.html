<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-dung-sai-heading" jhiTranslate="ctApp.dungSai.home.createOrEditLabel">Create or edit a Dung Sai</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.dungSai.cmLabel" for="field_cmLabel">Cm Label</label>
                    <input type="text" class="form-control" name="cmLabel" id="field_cmLabel"
                           formControlName="cmLabel"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.dungSai.inchLabel" for="field_inchLabel">Inch Label</label>
                    <input type="text" class="form-control" name="inchLabel" id="field_inchLabel"
                           formControlName="inchLabel"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.dungSai.cmValue" for="field_cmValue">Cm Value</label>
                    <input type="number" class="form-control" name="cmValue" id="field_cmValue"
                           formControlName="cmValue"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.dungSai.inchValue" for="field_inchValue">Inch Value</label>
                    <input type="number" class="form-control" name="inchValue" id="field_inchValue"
                           formControlName="inchValue"/>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
