<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proChuyen">
            <h2><span jhiTranslate="ctApp.proChuyen.detail.title">Pro Chuyen</span> {{proChuyen.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proChuyen.ten">Ten</span></dt>
                <dd>
                    <span>{{proChuyen.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proChuyen.stt">Stt</span></dt>
                <dd>
                    <span>{{proChuyen.stt}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proChuyen.tenLoaiChuyen">Ten Loai Chuyen</span></dt>
                <dd>
                    <span>{{proChuyen.tenLoaiChuyen}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proChuyen.proLoaiChuyen">Pro Loai Chuyen</span></dt>
                <dd>
                    <div *ngIf="proChuyen.proLoaiChuyenId">
                        <a [routerLink]="['/sys/pro-loai-chuyen', proChuyen.proLoaiChuyenId, 'view']">{{proChuyen.proLoaiChuyenTen}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="ctApp.proChuyen.proNhaMay">Pro Nha May</span></dt>
                <dd>
                    <div *ngIf="proChuyen.proNhaMayId">
                        <a [routerLink]="['/sys/pro-nha-may', proChuyen.proNhaMayId, 'view']">{{proChuyen.proNhaMayTen}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-chuyen', proChuyen.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
