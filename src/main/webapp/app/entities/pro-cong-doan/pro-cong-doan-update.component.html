<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-cong-doan-heading" jhiTranslate="ctApp.proCongDoan.home.createOrEditLabel">Create or edit a Pro Cong Doan</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCongDoan.ten" for="field_ten">Ten</label>
                    <input type="text" class="form-control" name="ten" id="field_ten"
                           formControlName="ten"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCongDoan.nhomCongDoan" for="field_nhomCongDoan">Nhom Cong Doan</label>
                    <input type="text" class="form-control" name="nhomCongDoan" id="field_nhomCongDoan"
                           formControlName="nhomCongDoan"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proCongDoan.proNhomCongDoan" for="field_proNhomCongDoan">Pro Nhom Cong Doan</label>
                    <select class="form-control" id="field_proNhomCongDoan" name="proNhomCongDoan" formControlName="proNhomCongDoanId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proNhomCongDoanOption.id" *ngFor="let proNhomCongDoanOption of pronhomcongdoans; trackBy: trackProNhomCongDoanById">{{proNhomCongDoanOption.ten}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
