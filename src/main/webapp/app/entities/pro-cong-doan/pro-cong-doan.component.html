<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proCongDoan.home.title">Pro Cong Doans</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-cong-doan" [routerLink]="['/sys/pro-cong-doan/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proCongDoan.home.createLabel">
            Create a new Pro Cong Doan
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proCongDoans?.length === 0">
        <span jhiTranslate="ctApp.proCongDoan.home.notFound">No proCongDoans found</span>
    </div>
    <div class="table-responsive" *ngIf="proCongDoans?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ten"><span jhiTranslate="ctApp.proCongDoan.ten">Ten</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="nhomCongDoan"><span jhiTranslate="ctApp.proCongDoan.nhomCongDoan">Nhom Cong Doan</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proNhomCongDoanTen"><span jhiTranslate="ctApp.proCongDoan.proNhomCongDoan">Pro Nhom Cong Doan</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proCongDoan of proCongDoans ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-cong-doan', proCongDoan.id, 'view' ]">{{proCongDoan.id}}</a></td>
                <td>{{proCongDoan.ten}}</td>
                <td>{{proCongDoan.nhomCongDoan}}</td>
                <td>
                    <div *ngIf="proCongDoan.proNhomCongDoanId">
                        <a [routerLink]="['/sys/pro-nhom-cong-doan', proCongDoan.proNhomCongDoanId , 'view' ]" >{{proCongDoan.proNhomCongDoanTen}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-doan', proCongDoan.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-doan', proCongDoan.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-cong-doan', { outlets: { popup: proCongDoan.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proCongDoans?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
