<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="libSoLuongPoKiem">
            <h2><span jhiTranslate="ctApp.libSoLuongPoKiem.detail.title">Lib So Luong Po Kiem</span> {{libSoLuongPoKiem.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.libSoLuongPoKiem.value">Value</span></dt>
                <dd>
                    <span>{{libSoLuongPoKiem.value}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/lib-so-luong-po-kiem', libSoLuongPoKiem.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
