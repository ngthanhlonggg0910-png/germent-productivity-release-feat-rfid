<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proAql.home.title">Pro Aqls</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-aql" [routerLink]="['/sys/pro-aql/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proAql.home.createLabel">
            Create a new Pro Aql
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proAqls?.length === 0">
        <span jhiTranslate="ctApp.proAql.home.notFound">No proAqls found</span>
    </div>
    <div class="table-responsive" *ngIf="proAqls?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr>
            <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.aql">Aql</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.soLuongDonHangTu">So Luong Don Hang Tu</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.soLuongDonHangDen">So Luong Don Hang Den</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.soLuongKiem">So Luong Kiem</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.soLuongSeFail">So Luong Se Fail</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proAql.soLuongSePass">So Luong Se Pass</span></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proAql of proAqls ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-aql', proAql.id, 'view' ]">{{proAql.id}}</a></td>
                <td>{{proAql.aql}}</td>
                <td>{{proAql.soLuongDonHangTu}}</td>
                <td>{{proAql.soLuongDonHangDen}}</td>
                <td>{{proAql.soLuongKiem}}</td>
                <td>{{proAql.soLuongSeFail}}</td>
                <td>{{proAql.soLuongSePass}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-aql', proAql.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-aql', proAql.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-aql', { outlets: { popup: proAql.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
