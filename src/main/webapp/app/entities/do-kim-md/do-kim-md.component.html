<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.doKimMd.home.title">Do Kim Mds</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-do-kim-md" [routerLink]="['/sys/do-kim-md/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.doKimMd.home.createLabel">
            Create a new Do Kim Md
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="doKimMds?.length === 0">
        <span jhiTranslate="ctApp.doKimMd.home.notFound">No doKimMds found</span>
    </div>
    <div class="table-responsive" *ngIf="doKimMds?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr>
            <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.doKimMd.value">Value</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.doKimMd.display">Display</span></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let doKimMd of doKimMds ;trackBy: trackId">
                <td><a [routerLink]="['/sys/do-kim-md', doKimMd.id, 'view' ]">{{doKimMd.id}}</a></td>
                <td>{{doKimMd.value}}</td>
                <td>{{doKimMd.display}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/do-kim-md', doKimMd.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/do-kim-md', doKimMd.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/do-kim-md', { outlets: { popup: doKimMd.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
