<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.thongSoDo.home.title">Thong So Dos</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-thong-so-do" [routerLink]="['/sys/thong-so-do/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.thongSoDo.home.createLabel">
            Create a new Thong So Do
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="thongSoDos?.length === 0">
        <span jhiTranslate="ctApp.thongSoDo.home.notFound">No thongSoDos found</span>
    </div>
    <div class="table-responsive" *ngIf="thongSoDos?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="code"><span jhiTranslate="ctApp.thongSoDo.code">Code</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ten"><span jhiTranslate="ctApp.thongSoDo.ten">Ten</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="dungSaiInchLabel"><span jhiTranslate="ctApp.thongSoDo.dungSai">Dung Sai</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let thongSoDo of thongSoDos ;trackBy: trackId">
                <td><a [routerLink]="['/sys/thong-so-do', thongSoDo.id, 'view' ]">{{thongSoDo.id}}</a></td>
                <td>{{thongSoDo.code}}</td>
                <td>{{thongSoDo.ten}}</td>
                <td>
                    <div *ngIf="thongSoDo.dungSaiId">
                        <a [routerLink]="['/sys/dung-sai', thongSoDo.dungSaiId , 'view' ]" >{{thongSoDo.dungSaiInchLabel}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do', thongSoDo.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do', thongSoDo.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do', { outlets: { popup: thongSoDo.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="thongSoDos?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
