<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="thongSoDo">
            <h2><span jhiTranslate="ctApp.thongSoDo.detail.title">Thong So Do</span> {{thongSoDo.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.thongSoDo.code">Code</span></dt>
                <dd>
                    <span>{{thongSoDo.code}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.thongSoDo.ten">Ten</span></dt>
                <dd>
                    <span>{{thongSoDo.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.thongSoDo.dungSai">Dung Sai</span></dt>
                <dd>
                    <div *ngIf="thongSoDo.dungSaiId">
                        <a [routerLink]="['/sys/dung-sai', thongSoDo.dungSaiId, 'view']">{{thongSoDo.dungSaiInchLabel}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/thong-so-do', thongSoDo.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
