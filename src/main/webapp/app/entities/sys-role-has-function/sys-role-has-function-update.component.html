<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-sys-role-has-function-heading" jhiTranslate="ctApp.sysRoleHasFunction.home.createOrEditLabel">Create or edit a Sys Role Has Function</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysRoleHasFunction.activated" for="field_activated">Activated</label>
                    <input type="checkbox" class="form-control" name="activated" id="field_activated"
                           formControlName="activated"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysRoleHasFunction.sysFunction" for="field_sysFunction">Sys Function</label>
                    <select class="form-control" id="field_sysFunction" name="sysFunction" formControlName="sysFunctionId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="sysFunctionOption.id" *ngFor="let sysFunctionOption of sysfunctions; trackBy: trackSysFunctionById">{{sysFunctionOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.sysRoleHasFunction.authority" for="field_authority">Authority</label>
                    <select class="form-control" id="field_authority" name="authority" formControlName="authorityName">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="authorityOption.id" *ngFor="let authorityOption of authorities; trackBy: trackAuthorityById">{{authorityOption.name}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
