<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="sysRoleHasFunction">
            <h2><span jhiTranslate="ctApp.sysRoleHasFunction.detail.title">Sys Role Has Function</span> {{sysRoleHasFunction.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.sysRoleHasFunction.activated">Activated</span></dt>
                <dd>
                    <span>{{sysRoleHasFunction.activated}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysRoleHasFunction.sysFunction">Sys Function</span></dt>
                <dd>
                    <div *ngIf="sysRoleHasFunction.sysFunctionId">
                        <a [routerLink]="['/sys/sys-function', sysRoleHasFunction.sysFunctionId, 'view']">{{sysRoleHasFunction.sysFunctionId}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="ctApp.sysRoleHasFunction.authority">Authority</span></dt>
                <dd>
                    <div *ngIf="sysRoleHasFunction.authorityId">
                        <a [routerLink]="['/sys/authority', sysRoleHasFunction.authorityId, 'view']">{{sysRoleHasFunction.authorityName}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/sys-role-has-function', sysRoleHasFunction.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
