<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proTenMua">
            <h2><span jhiTranslate="ctApp.proTenMua.detail.title">Pro Ten Mua</span> {{proTenMua.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proTenMua.tenMua">Ten Mua</span></dt>
                <dd>
                    <span>{{proTenMua.tenMua}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-ten-mua', proTenMua.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
