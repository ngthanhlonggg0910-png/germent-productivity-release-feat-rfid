<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proKhachHang">
            <h2><span jhiTranslate="ctApp.proKhachHang.detail.title">Pro Khach Hang</span> {{proKhachHang.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proKhachHang.ten">Ten</span></dt>
                <dd>
                    <span>{{proKhachHang.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proKhachHang.nhom">Nhom</span></dt>
                <dd>
                    <span>{{proKhachHang.nhom}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proKhachHang.diaChi">Dia Chi</span></dt>
                <dd>
                    <span>{{proKhachHang.diaChi}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-khach-hang', proKhachHang.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
