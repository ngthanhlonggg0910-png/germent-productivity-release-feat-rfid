<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.mapButtonAction.home.title">Map Button Actions</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-map-button-action" [routerLink]="['/sys/map-button-action/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.mapButtonAction.home.createLabel">
            Create a new Map Button Action
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="mapButtonActions?.length === 0">
        <span jhiTranslate="ctApp.mapButtonAction.home.notFound">No mapButtonActions found</span>
    </div>
    <div class="table-responsive" *ngIf="mapButtonActions?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="sourceAliasState"><span jhiTranslate="ctApp.mapButtonAction.sourceAliasState">Source Alias State</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="targetState"><span jhiTranslate="ctApp.mapButtonAction.targetState">Target State</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="trackingTypeName"><span jhiTranslate="ctApp.mapButtonAction.trackingType">Tracking Type</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let mapButtonAction of mapButtonActions ;trackBy: trackId">
                <td><a [routerLink]="['/sys/map-button-action', mapButtonAction.id, 'view' ]">{{mapButtonAction.id}}</a></td>
                <td>{{mapButtonAction.sourceAliasState}}</td>
                <td jhiTranslate="{{'ctApp.NVButtonState.' + mapButtonAction.targetState}}">{{mapButtonAction.targetState}}</td>
                <td>
                    <div *ngIf="mapButtonAction.trackingTypeId">
                        <a [routerLink]="['/sys/nv-button-tracking-type', mapButtonAction.trackingTypeId , 'view' ]" >{{mapButtonAction.trackingTypeName}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/map-button-action', mapButtonAction.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/map-button-action', mapButtonAction.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/map-button-action', { outlets: { popup: mapButtonAction.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="mapButtonActions?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
