<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="sysGroupModule">
            <h2><span jhiTranslate="ctApp.sysGroupModule.detail.title">Sys Group Module</span> {{sysGroupModule.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.sysGroupModule.name">Name</span></dt>
                <dd>
                    <span>{{sysGroupModule.name}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysGroupModule.caption">Caption</span></dt>
                <dd>
                    <span>{{sysGroupModule.caption}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysGroupModule.primaryImageUri">Primary Image Uri</span></dt>
                <dd>
                    <span>{{sysGroupModule.primaryImageUri}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysGroupModule.secondaryImageUri">Secondary Image Uri</span></dt>
                <dd>
                    <span>{{sysGroupModule.secondaryImageUri}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/sys-group-module', sysGroupModule.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
