<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-tai-khoan-check-point-heading" jhiTranslate="ctApp.proTaiKhoanCheckPoint.home.createOrEditLabel">Create or edit a Pro Tai Khoan Check Point</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proTaiKhoanCheckPoint.taiKhoan" for="field_taiKhoan">Tai Khoan</label>
                    <input type="text" class="form-control" name="taiKhoan" id="field_taiKhoan"
                           formControlName="taiKhoan"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proTaiKhoanCheckPoint.checked" for="field_checked">Checked</label>
                    <input type="checkbox" class="form-control" name="checked" id="field_checked"
                           formControlName="checked"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proTaiKhoanCheckPoint.proCheckPoint" for="field_proCheckPoint">Pro Check Point</label>
                    <select class="form-control" id="field_proCheckPoint" name="proCheckPoint" formControlName="proCheckPointId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proCheckPointOption.id" *ngFor="let proCheckPointOption of procheckpoints; trackBy: trackProCheckPointById">{{proCheckPointOption.ten}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
