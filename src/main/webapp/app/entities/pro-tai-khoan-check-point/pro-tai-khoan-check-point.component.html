<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proTaiKhoanCheckPoint.home.title">Pro Tai Khoan Check Points</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-tai-khoan-check-point" [routerLink]="['/sys/pro-tai-khoan-check-point/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proTaiKhoanCheckPoint.home.createLabel">
            Create a new Pro Tai Khoan Check Point
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proTaiKhoanCheckPoints?.length === 0">
        <span jhiTranslate="ctApp.proTaiKhoanCheckPoint.home.notFound">No proTaiKhoanCheckPoints found</span>
    </div>
    <div class="table-responsive" *ngIf="proTaiKhoanCheckPoints?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="taiKhoan"><span jhiTranslate="ctApp.proTaiKhoanCheckPoint.taiKhoan">Tai Khoan</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="checked"><span jhiTranslate="ctApp.proTaiKhoanCheckPoint.checked">Checked</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proCheckPointTen"><span jhiTranslate="ctApp.proTaiKhoanCheckPoint.proCheckPoint">Pro Check Point</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proTaiKhoanCheckPoint of proTaiKhoanCheckPoints ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-tai-khoan-check-point', proTaiKhoanCheckPoint.id, 'view' ]">{{proTaiKhoanCheckPoint.id}}</a></td>
                <td>{{proTaiKhoanCheckPoint.taiKhoan}}</td>
                <td>{{proTaiKhoanCheckPoint.checked}}</td>
                <td>
                    <div *ngIf="proTaiKhoanCheckPoint.proCheckPointId">
                        <a [routerLink]="['/sys/pro-check-point', proTaiKhoanCheckPoint.proCheckPointId , 'view' ]" >{{proTaiKhoanCheckPoint.proCheckPointTen}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-tai-khoan-check-point', proTaiKhoanCheckPoint.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-tai-khoan-check-point', proTaiKhoanCheckPoint.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-tai-khoan-check-point', { outlets: { popup: proTaiKhoanCheckPoint.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proTaiKhoanCheckPoints?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
