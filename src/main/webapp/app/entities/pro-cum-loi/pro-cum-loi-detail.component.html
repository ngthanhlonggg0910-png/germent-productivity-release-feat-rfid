<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proCumLoi">
            <h2><span jhiTranslate="ctApp.proCumLoi.detail.title">Pro Cum Loi</span> {{proCumLoi.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proCumLoi.ten">Ten</span></dt>
                <dd>
                    <span>{{proCumLoi.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proCumLoi.mau">Mau</span></dt>
                <dd>
                    <span>{{proCumLoi.mau}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-cum-loi', proCumLoi.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
