<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-nscl-chi-tiet-loi-heading" jhiTranslate="ctApp.proNSCLChiTietLoi.home.createOrEditLabel">Create or edit a Pro NSCL Chi Tiet Loi</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.maLoi" for="field_maLoi">Ma Loi</label>
                    <input type="text" class="form-control" name="maLoi" id="field_maLoi"
                           formControlName="maLoi"/>
                    <div *ngIf="editForm.get('maLoi').invalid && (editForm.get('maLoi').dirty || editForm.get('maLoi').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('maLoi').errors.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.thoiGian" for="field_thoiGian">Thoi Gian</label>
                    <div class="d-flex">
                        <input id="field_thoiGian" type="datetime-local" class="form-control" name="thoiGian" formControlName="thoiGian" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                    <div *ngIf="editForm.get('thoiGian').invalid && (editForm.get('thoiGian').dirty || editForm.get('thoiGian').touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('thoiGian').errors.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                        <small class="form-text text-danger"
                            [hidden]="!editForm.get('thoiGian').errors?.ZonedDateTimelocal" jhiTranslate="entity.validation.ZonedDateTimelocal">
                            This field should be a date and time.
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.gioLam" for="field_gioLam">Gio Lam</label>
                    <select class="form-control" name="gioLam" formControlName="gioLam" id="field_gioLam">
                        <option value="C_1H">{{'ctApp.GioLam.C_1H' | translate}}</option>
                        <option value="C_2H">{{'ctApp.GioLam.C_2H' | translate}}</option>
                        <option value="C_3H">{{'ctApp.GioLam.C_3H' | translate}}</option>
                        <option value="C_4H">{{'ctApp.GioLam.C_4H' | translate}}</option>
                        <option value="C_5H">{{'ctApp.GioLam.C_5H' | translate}}</option>
                        <option value="C_6H">{{'ctApp.GioLam.C_6H' | translate}}</option>
                        <option value="C_7H">{{'ctApp.GioLam.C_7H' | translate}}</option>
                        <option value="C_8H">{{'ctApp.GioLam.C_8H' | translate}}</option>
                        <option value="C_9H">{{'ctApp.GioLam.C_9H' | translate}}</option>
                        <option value="C_10H">{{'ctApp.GioLam.C_10H' | translate}}</option>
                        <option value="C_11H">{{'ctApp.GioLam.C_11H' | translate}}</option>
                        <option value="C_12H">{{'ctApp.GioLam.C_12H' | translate}}</option>
                        <option value="C_13H">{{'ctApp.GioLam.C_13H' | translate}}</option>
                        <option value="C_14H">{{'ctApp.GioLam.C_14H' | translate}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.dx" for="field_dx">Dx</label>
                    <input type="number" class="form-control" name="dx" id="field_dx"
                           formControlName="dx"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.dy" for="field_dy">Dy</label>
                    <input type="number" class="form-control" name="dy" id="field_dy"
                           formControlName="dy"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.isFront" for="field_isFront">Is Front</label>
                    <input type="checkbox" class="form-control" name="isFront" id="field_isFront"
                           formControlName="isFront"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.isInside" for="field_isInside">Is Inside</label>
                    <input type="checkbox" class="form-control" name="isInside" id="field_isInside"
                           formControlName="isInside"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.proNSCL" for="field_proNSCL">Pro NSCL</label>
                    <select class="form-control" id="field_proNSCL" name="proNSCL" formControlName="proNSCLId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proNSCLOption.id" *ngFor="let proNSCLOption of pronscls; trackBy: trackProNSCLById">{{proNSCLOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNSCLChiTietLoi.proLoi" for="field_proLoi">Pro Loi</label>
                    <select class="form-control" id="field_proLoi" name="proLoi" formControlName="proLoiId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proLoiOption.id" *ngFor="let proLoiOption of prolois; trackBy: trackProLoiById">{{proLoiOption.maLoi}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
