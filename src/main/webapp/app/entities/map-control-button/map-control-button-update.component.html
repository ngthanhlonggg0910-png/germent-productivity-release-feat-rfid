<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-map-control-button-heading" jhiTranslate="ctApp.mapControlButton.home.createOrEditLabel">Create or edit a Map Control Button</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.mapControlButton.sourceButton" for="field_sourceButton">Source Button</label>
                    <select class="form-control" id="field_sourceButton" name="sourceButton" formControlName="sourceButtonId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="nVButtonOption.id" *ngFor="let nVButtonOption of nvbuttons; trackBy: trackNVButtonById">{{nVButtonOption.cmndTopic}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.mapControlButton.targetButton" for="field_targetButton">Target Button</label>
                    <select class="form-control" id="field_targetButton" name="targetButton" formControlName="targetButtonId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="nVButtonOption.id" *ngFor="let nVButtonOption of nvbuttons; trackBy: trackNVButtonById">{{nVButtonOption.cmndTopic}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
