<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="sysPermission">
            <h2><span jhiTranslate="ctApp.sysPermission.detail.title">Sys Permission</span> {{sysPermission.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.sysPermission.name">Name</span></dt>
                <dd>
                    <span>{{sysPermission.name}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysPermission.caption">Caption</span></dt>
                <dd>
                    <span>{{sysPermission.caption}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysPermission.level">Level</span></dt>
                <dd>
                    <span>{{sysPermission.level}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysPermission.imageUri">Image Uri</span></dt>
                <dd>
                    <span>{{sysPermission.imageUri}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysPermission.eventName">Event Name</span></dt>
                <dd>
                    <span>{{sysPermission.eventName}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.sysPermission.hotkey">Hotkey</span></dt>
                <dd>
                    <span>{{sysPermission.hotkey}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/sys-permission', sysPermission.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
