<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.sysPermission.home.title">Sys Permissions</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-sys-permission" [routerLink]="['/sys/sys-permission/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.sysPermission.home.createLabel">
            Create a new Sys Permission
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="sysPermissions?.length === 0">
        <span jhiTranslate="ctApp.sysPermission.home.notFound">No sysPermissions found</span>
    </div>
    <div class="table-responsive" *ngIf="sysPermissions?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="name"><span jhiTranslate="ctApp.sysPermission.name">Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="caption"><span jhiTranslate="ctApp.sysPermission.caption">Caption</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="level"><span jhiTranslate="ctApp.sysPermission.level">Level</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="imageUri"><span jhiTranslate="ctApp.sysPermission.imageUri">Image Uri</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="eventName"><span jhiTranslate="ctApp.sysPermission.eventName">Event Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="hotkey"><span jhiTranslate="ctApp.sysPermission.hotkey">Hotkey</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let sysPermission of sysPermissions ;trackBy: trackId">
                <td><a [routerLink]="['/sys/sys-permission', sysPermission.id, 'view' ]">{{sysPermission.id}}</a></td>
                <td>{{sysPermission.name}}</td>
                <td>{{sysPermission.caption}}</td>
                <td>{{sysPermission.level}}</td>
                <td>{{sysPermission.imageUri}}</td>
                <td>{{sysPermission.eventName}}</td>
                <td>{{sysPermission.hotkey}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/sys-permission', sysPermission.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-permission', sysPermission.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-permission', { outlets: { popup: sysPermission.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="sysPermissions?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
