<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proNhaMay.home.title">Pro Nha Mays</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-nha-may" [routerLink]="['/sys/pro-nha-may/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proNhaMay.home.createLabel">
            Create a new Pro Nha May
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proNhaMays?.length === 0">
        <span jhiTranslate="ctApp.proNhaMay.home.notFound">No proNhaMays found</span>
    </div>
    <div class="table-responsive" *ngIf="proNhaMays?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ten"><span jhiTranslate="ctApp.proNhaMay.ten">Ten</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="stt"><span jhiTranslate="ctApp.proNhaMay.stt">Stt</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proCongTyTen"><span jhiTranslate="ctApp.proNhaMay.proCongTy">Pro Cong Ty</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proNhaMay of proNhaMays ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-nha-may', proNhaMay.id, 'view' ]">{{proNhaMay.id}}</a></td>
                <td>{{proNhaMay.ten}}</td>
                <td>{{proNhaMay.stt}}</td>
                <td>
                    <div *ngIf="proNhaMay.proCongTyId">
                        <a [routerLink]="['/sys/pro-cong-ty', proNhaMay.proCongTyId , 'view' ]" >{{proNhaMay.proCongTyTen}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-nha-may', proNhaMay.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-nha-may', proNhaMay.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-nha-may', { outlets: { popup: proNhaMay.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proNhaMays?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
