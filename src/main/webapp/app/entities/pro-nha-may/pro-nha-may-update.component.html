<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-nha-may-heading" jhiTranslate="ctApp.proNhaMay.home.createOrEditLabel">Create or edit a Pro Nha May</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNhaMay.ten" for="field_ten">Ten</label>
                    <input type="text" class="form-control" name="ten" id="field_ten"
                           formControlName="ten"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNhaMay.stt" for="field_stt">Stt</label>
                    <input type="number" class="form-control" name="stt" id="field_stt"
                           formControlName="stt"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proNhaMay.proCongTy" for="field_proCongTy">Pro Cong Ty</label>
                    <select class="form-control" id="field_proCongTy" name="proCongTy" formControlName="proCongTyId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proCongTyOption.id" *ngFor="let proCongTyOption of procongties; trackBy: trackProCongTyById">{{proCongTyOption.ten}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
