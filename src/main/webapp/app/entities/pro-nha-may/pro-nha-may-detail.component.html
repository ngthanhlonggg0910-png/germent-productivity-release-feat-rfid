<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proNhaMay">
            <h2><span jhiTranslate="ctApp.proNhaMay.detail.title">Pro Nha May</span> {{proNhaMay.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proNhaMay.ten">Ten</span></dt>
                <dd>
                    <span>{{proNhaMay.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proNhaMay.stt">Stt</span></dt>
                <dd>
                    <span>{{proNhaMay.stt}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proNhaMay.proCongTy">Pro Cong Ty</span></dt>
                <dd>
                    <div *ngIf="proNhaMay.proCongTyId">
                        <a [routerLink]="['/sys/pro-cong-ty', proNhaMay.proCongTyId, 'view']">{{proNhaMay.proCongTyTen}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-nha-may', proNhaMay.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
