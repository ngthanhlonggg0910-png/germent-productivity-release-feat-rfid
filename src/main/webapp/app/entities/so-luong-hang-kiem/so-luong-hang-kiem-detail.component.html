<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="soLuongHangKiem">
            <h2><span jhiTranslate="ctApp.soLuongHangKiem.detail.title">So Luong Hang Kiem</span> {{soLuongHangKiem.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.soLuongHangKiem.soLuong">So Luong</span></dt>
                <dd>
                    <span>{{soLuongHangKiem.soLuong}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/so-luong-hang-kiem', soLuongHangKiem.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
