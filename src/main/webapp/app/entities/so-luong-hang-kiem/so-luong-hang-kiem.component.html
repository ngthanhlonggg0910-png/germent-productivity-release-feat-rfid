<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.soLuongHangKiem.home.title">So Luong Hang Kiems</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-so-luong-hang-kiem" [routerLink]="['/so-luong-hang-kiem/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.soLuongHangKiem.home.createLabel">
            Create a new So Luong Hang Kiem
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="soLuongHangKiems?.length === 0">
        <span jhiTranslate="ctApp.soLuongHangKiem.home.notFound">No soLuongHangKiems found</span>
    </div>
    <div class="table-responsive" *ngIf="soLuongHangKiems?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr>
            <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.soLuongHangKiem.soLuong">So Luong</span></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let soLuongHangKiem of soLuongHangKiems ;trackBy: trackId">
                <td><a [routerLink]="['/so-luong-hang-kiem', soLuongHangKiem.id, 'view' ]">{{soLuongHangKiem.id}}</a></td>
                <td>{{soLuongHangKiem.soLuong}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/so-luong-hang-kiem', soLuongHangKiem.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/so-luong-hang-kiem', soLuongHangKiem.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/so-luong-hang-kiem', { outlets: { popup: soLuongHangKiem.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
