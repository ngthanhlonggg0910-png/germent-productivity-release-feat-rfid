<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.thuVienLoi.home.title">Thu Vien Lois</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-thu-vien-loi" [routerLink]="['/sys/thu-vien-loi/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.thuVienLoi.home.createLabel">
            Create a new Thu Vien Loi
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="thuVienLois?.length === 0">
        <span jhiTranslate="ctApp.thuVienLoi.home.notFound">No thuVienLois found</span>
    </div>
    <div class="table-responsive" *ngIf="thuVienLois?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="maLoi"><span jhiTranslate="ctApp.thuVienLoi.maLoi">Ma Loi</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="tenLoi"><span jhiTranslate="ctApp.thuVienLoi.tenLoi">Ten Loi</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="nguoiTao"><span jhiTranslate="ctApp.thuVienLoi.nguoiTao">Nguoi Tao</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ngayTao"><span jhiTranslate="ctApp.thuVienLoi.ngayTao">Ngay Tao</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="userId"><span jhiTranslate="ctApp.thuVienLoi.userId">User Id</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let thuVienLoi of thuVienLois ;trackBy: trackId">
                <td><a [routerLink]="['/sys/thu-vien-loi', thuVienLoi.id, 'view' ]">{{thuVienLoi.id}}</a></td>
                <td>{{thuVienLoi.maLoi}}</td>
                <td>{{thuVienLoi.tenLoi}}</td>
                <td>{{thuVienLoi.nguoiTao}}</td>
                <td>{{thuVienLoi.ngayTao | date:'medium'}}</td>
                <td>{{thuVienLoi.userId}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/thu-vien-loi', thuVienLoi.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thu-vien-loi', thuVienLoi.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thu-vien-loi', { outlets: { popup: thuVienLoi.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="thuVienLois?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
