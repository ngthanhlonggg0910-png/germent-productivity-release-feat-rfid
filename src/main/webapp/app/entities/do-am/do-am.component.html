<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.doAm.home.title">Do Ams</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-do-am" [routerLink]="['/do-am/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.doAm.home.createLabel">
            Create a new Do Am
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="doAms?.length === 0">
        <span jhiTranslate="ctApp.doAm.home.notFound">No doAms found</span>
    </div>
    <div class="table-responsive" *ngIf="doAms?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr>
            <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.doAm.value">Value</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.doAm.display">Display</span></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let doAm of doAms ;trackBy: trackId">
                <td><a [routerLink]="['/do-am', doAm.id, 'view' ]">{{doAm.id}}</a></td>
                <td>{{doAm.value}}</td>
                <td>{{doAm.display}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/do-am', doAm.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/do-am', doAm.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/do-am', { outlets: { popup: doAm.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
