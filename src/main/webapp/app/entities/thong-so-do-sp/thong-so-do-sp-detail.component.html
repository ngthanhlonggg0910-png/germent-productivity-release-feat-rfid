<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="thongSoDoSP">
            <h2><span jhiTranslate="ctApp.thongSoDoSP.detail.title">Thong So Do SP</span> {{thongSoDoSP.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.thongSoDoSP.note">Note</span></dt>
                <dd>
                    <span>{{thongSoDoSP.note}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.thongSoDoSP.thongSoDo">Thong So Do</span></dt>
                <dd>
                    <div *ngIf="thongSoDoSP.thongSoDoId">
                        <a [routerLink]="['/sys/thong-so-do', thongSoDoSP.thongSoDoId, 'view']">{{thongSoDoSP.thongSoDoCode}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="ctApp.thongSoDoSP.dungSai">Dung Sai</span></dt>
                <dd>
                    <div *ngIf="thongSoDoSP.dungSaiId">
                        <a [routerLink]="['/sys/dung-sai', thongSoDoSP.dungSaiId, 'view']">{{thongSoDoSP.dungSaiInchLabel}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="ctApp.thongSoDoSP.proSanPham">Pro San Pham</span></dt>
                <dd>
                    <div *ngIf="thongSoDoSP.proSanPhamId">
                        <a [routerLink]="['/sys/pro-san-pham', thongSoDoSP.proSanPhamId, 'view']">{{thongSoDoSP.proSanPhamMaSanPham}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/thong-so-do-sp', thongSoDoSP.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
