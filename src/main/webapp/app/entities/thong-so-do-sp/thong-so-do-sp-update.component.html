<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-thong-so-do-sp-heading" jhiTranslate="ctApp.thongSoDoSP.home.createOrEditLabel">Create or edit a Thong So Do SP</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoDoSP.note" for="field_note">Note</label>
                    <input type="text" class="form-control" name="note" id="field_note"
                           formControlName="note"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoDoSP.thongSoDo" for="field_thongSoDo">Thong So Do</label>
                    <select class="form-control" id="field_thongSoDo" name="thongSoDo" formControlName="thongSoDoId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="thongSoDoOption.id" *ngFor="let thongSoDoOption of thongsodos; trackBy: trackThongSoDoById">{{thongSoDoOption.code}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoDoSP.dungSai" for="field_dungSai">Dung Sai</label>
                    <select class="form-control" id="field_dungSai" name="dungSai" formControlName="dungSaiId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="dungSaiOption.id" *ngFor="let dungSaiOption of dungsais; trackBy: trackDungSaiById">{{dungSaiOption.inchLabel}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoDoSP.proSanPham" for="field_proSanPham">Pro San Pham</label>
                    <select class="form-control" id="field_proSanPham" name="proSanPham" formControlName="proSanPhamId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proSanPhamOption.id" *ngFor="let proSanPhamOption of prosanphams; trackBy: trackProSanPhamById">{{proSanPhamOption.maSanPham}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
