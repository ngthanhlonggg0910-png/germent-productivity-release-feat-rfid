<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.thongSoDoSP.home.title">Thong So Do SPS</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-thong-so-do-sp" [routerLink]="['/sys/thong-so-do-sp/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.thongSoDoSP.home.createLabel">
            Create a new Thong So Do SP
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="thongSoDoSPS?.length === 0">
        <span jhiTranslate="ctApp.thongSoDoSP.home.notFound">No thongSoDoSPS found</span>
    </div>
    <div class="table-responsive" *ngIf="thongSoDoSPS?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="note"><span jhiTranslate="ctApp.thongSoDoSP.note">Note</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="thongSoDoCode"><span jhiTranslate="ctApp.thongSoDoSP.thongSoDo">Thong So Do</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="dungSaiInchLabel"><span jhiTranslate="ctApp.thongSoDoSP.dungSai">Dung Sai</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proSanPhamMaSanPham"><span jhiTranslate="ctApp.thongSoDoSP.proSanPham">Pro San Pham</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let thongSoDoSP of thongSoDoSPS ;trackBy: trackId">
                <td><a [routerLink]="['/sys/thong-so-do-sp', thongSoDoSP.id, 'view' ]">{{thongSoDoSP.id}}</a></td>
                <td>{{thongSoDoSP.note}}</td>
                <td>
                    <div *ngIf="thongSoDoSP.thongSoDoId">
                        <a [routerLink]="['/sys/thong-so-do', thongSoDoSP.thongSoDoId , 'view' ]" >{{thongSoDoSP.thongSoDoCode}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="thongSoDoSP.dungSaiId">
                        <a [routerLink]="['/sys/dung-sai', thongSoDoSP.dungSaiId , 'view' ]" >{{thongSoDoSP.dungSaiInchLabel}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="thongSoDoSP.proSanPhamId">
                        <a [routerLink]="['/sys/pro-san-pham', thongSoDoSP.proSanPhamId , 'view' ]" >{{thongSoDoSP.proSanPhamMaSanPham}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do-sp', thongSoDoSP.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do-sp', thongSoDoSP.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-do-sp', { outlets: { popup: thongSoDoSP.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="thongSoDoSPS?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
