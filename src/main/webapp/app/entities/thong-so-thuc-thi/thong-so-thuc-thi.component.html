<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.thongSoThucThi.home.title">Thong So Thuc This</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-thong-so-thuc-thi" [routerLink]="['/sys/thong-so-thuc-thi/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.thongSoThucThi.home.createLabel">
            Create a new Thong So Thuc Thi
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="thongSoThucThis?.length === 0">
        <span jhiTranslate="ctApp.thongSoThucThi.home.notFound">No thongSoThucThis found</span>
    </div>
    <div class="table-responsive" *ngIf="thongSoThucThis?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="spIndex"><span jhiTranslate="ctApp.thongSoThucThi.spIndex">Sp Index</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="thongSoDoSPSizeId"><span jhiTranslate="ctApp.thongSoThucThi.thongSoDoSPSize">Thong So Do SP Size</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="dungSaiId"><span jhiTranslate="ctApp.thongSoThucThi.dungSai">Dung Sai</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="proKeHoachSanXuatId"><span jhiTranslate="ctApp.thongSoThucThi.proKeHoachSanXuat">Pro Ke Hoach San Xuat</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let thongSoThucThi of thongSoThucThis ;trackBy: trackId">
                <td><a [routerLink]="['/sys/thong-so-thuc-thi', thongSoThucThi.id, 'view' ]">{{thongSoThucThi.id}}</a></td>
                <td>{{thongSoThucThi.spIndex}}</td>
                <td>
                    <div *ngIf="thongSoThucThi.thongSoDoSPSizeId">
                        <a [routerLink]="['/sys/thong-so-do-sp-size', thongSoThucThi.thongSoDoSPSizeId , 'view' ]" >{{thongSoThucThi.thongSoDoSPSizeId}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="thongSoThucThi.dungSaiId">
                        <a [routerLink]="['/sys/dung-sai', thongSoThucThi.dungSaiId , 'view' ]" >{{thongSoThucThi.dungSaiId}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="thongSoThucThi.proKeHoachSanXuatId">
                        <a [routerLink]="['/sys/pro-ke-hoach-san-xuat', thongSoThucThi.proKeHoachSanXuatId , 'view' ]" >{{thongSoThucThi.proKeHoachSanXuatId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-thuc-thi', thongSoThucThi.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-thuc-thi', thongSoThucThi.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/thong-so-thuc-thi', { outlets: { popup: thongSoThucThi.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="thongSoThucThis?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
