<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-thong-so-thuc-thi-heading" jhiTranslate="ctApp.thongSoThucThi.home.createOrEditLabel">Create or edit a Thong So Thuc Thi</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoThucThi.spIndex" for="field_spIndex">Sp Index</label>
                    <input type="text" class="form-control" name="spIndex" id="field_spIndex"
                           formControlName="spIndex"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoThucThi.thongSoDoSPSize" for="field_thongSoDoSPSize">Thong So Do SP Size</label>
                    <select class="form-control" id="field_thongSoDoSPSize" name="thongSoDoSPSize" formControlName="thongSoDoSPSizeId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="thongSoDoSPSizeOption.id" *ngFor="let thongSoDoSPSizeOption of thongsodospsizes; trackBy: trackThongSoDoSPSizeById">{{thongSoDoSPSizeOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoThucThi.dungSai" for="field_dungSai">Dung Sai</label>
                    <select class="form-control" id="field_dungSai" name="dungSai" formControlName="dungSaiId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="dungSaiOption.id" *ngFor="let dungSaiOption of dungsais; trackBy: trackDungSaiById">{{dungSaiOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.thongSoThucThi.proKeHoachSanXuat" for="field_proKeHoachSanXuat">Pro Ke Hoach San Xuat</label>
                    <select class="form-control" id="field_proKeHoachSanXuat" name="proKeHoachSanXuat" formControlName="proKeHoachSanXuatId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proKeHoachSanXuatOption.id" *ngFor="let proKeHoachSanXuatOption of prokehoachsanxuats; trackBy: trackProKeHoachSanXuatById">{{proKeHoachSanXuatOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
