<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="groupTopic">
            <h2><span jhiTranslate="ctApp.groupTopic.detail.title">Group Topic</span> {{groupTopic.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.groupTopic.name">Name</span></dt>
                <dd>
                    <span>{{groupTopic.name}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.groupTopic.topicType">Topic Type</span></dt>
                <dd>
                    <span jhiTranslate="{{'ctApp.TopicType.' + groupTopic.topicType}}">{{groupTopic.topicType}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.groupTopic.type">Type</span></dt>
                <dd>
                    <span jhiTranslate="{{'ctApp.GroupButtonType.' + groupTopic.type}}">{{groupTopic.type}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/group-topic', groupTopic.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
