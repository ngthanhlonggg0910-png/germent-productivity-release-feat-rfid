<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.groupTopic.home.title">Group Topics</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-group-topic" [routerLink]="['/sys/group-topic/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.groupTopic.home.createLabel">
            Create a new Group Topic
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="groupTopics?.length === 0">
        <span jhiTranslate="ctApp.groupTopic.home.notFound">No groupTopics found</span>
    </div>
    <div class="table-responsive" *ngIf="groupTopics?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="name"><span jhiTranslate="ctApp.groupTopic.name">Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="topicType"><span jhiTranslate="ctApp.groupTopic.topicType">Topic Type</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="type"><span jhiTranslate="ctApp.groupTopic.type">Type</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let groupTopic of groupTopics ;trackBy: trackId">
                <td><a [routerLink]="['/sys/group-topic', groupTopic.id, 'view' ]">{{groupTopic.id}}</a></td>
                <td>{{groupTopic.name}}</td>
                <td jhiTranslate="{{'ctApp.TopicType.' + groupTopic.topicType}}">{{groupTopic.topicType}}</td>
                <td jhiTranslate="{{'ctApp.GroupButtonType.' + groupTopic.type}}">{{groupTopic.type}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/group-topic', groupTopic.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/group-topic', groupTopic.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/group-topic', { outlets: { popup: groupTopic.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="groupTopics?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
