<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-group-topic-heading" jhiTranslate="ctApp.groupTopic.home.createOrEditLabel">Create or edit a Group Topic</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.groupTopic.name" for="field_name">Name</label>
                    <input type="text" class="form-control" name="name" id="field_name"
                           formControlName="name"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.groupTopic.topicType" for="field_topicType">Topic Type</label>
                    <select class="form-control" name="topicType" formControlName="topicType" id="field_topicType">
                        <option value="CMND">{{'ctApp.TopicType.CMND' | translate}}</option>
                        <option value="TELE">{{'ctApp.TopicType.TELE' | translate}}</option>
                        <option value="STAT">{{'ctApp.TopicType.STAT' | translate}}</option>
                        <option value="DISCOVERY">{{'ctApp.TopicType.DISCOVERY' | translate}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.groupTopic.type" for="field_type">Type</label>
                    <select class="form-control" name="type" formControlName="type" id="field_type">
                        <option value="LIGHT">{{'ctApp.GroupButtonType.LIGHT' | translate}}</option>
                        <option value="SEWING">{{'ctApp.GroupButtonType.SEWING' | translate}}</option>
                    </select>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
