<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proGioLamViec.home.title">Pro Gio Lam Viecs</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-gio-lam-viec" [routerLink]="['/sys/pro-gio-lam-viec/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proGioLamViec.home.createLabel">
            Create a new Pro Gio Lam Viec
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proGioLamViecs?.length === 0">
        <span jhiTranslate="ctApp.proGioLamViec.home.notFound">No proGioLamViecs found</span>
    </div>
    <div class="table-responsive" *ngIf="proGioLamViecs?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="gioBatDau"><span jhiTranslate="ctApp.proGioLamViec.gioBatDau">Gio Bat Dau</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="gioKetThuc"><span jhiTranslate="ctApp.proGioLamViec.gioKetThuc">Gio Ket Thuc</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="gioLam"><span jhiTranslate="ctApp.proGioLamViec.gioLam">Gio Lam</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="thoiGian"><span jhiTranslate="ctApp.proGioLamViec.thoiGian">Thoi Gian</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="captionTV"><span jhiTranslate="ctApp.proGioLamViec.captionTV">Caption TV</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proGioLamViec of proGioLamViecs ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-gio-lam-viec', proGioLamViec.id, 'view' ]">{{proGioLamViec.id}}</a></td>
                <td>{{proGioLamViec.gioBatDau | date:'medium'}}</td>
                <td>{{proGioLamViec.gioKetThuc | date:'medium'}}</td>
                <td jhiTranslate="{{'ctApp.GioLam.' + proGioLamViec.gioLam}}">{{proGioLamViec.gioLam}}</td>
                <td>{{proGioLamViec.thoiGian}}</td>
                <td>{{proGioLamViec.captionTV}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-gio-lam-viec', proGioLamViec.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-gio-lam-viec', proGioLamViec.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-gio-lam-viec', { outlets: { popup: proGioLamViec.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proGioLamViecs?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
