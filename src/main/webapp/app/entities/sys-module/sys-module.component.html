<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.sysModule.home.title">Sys Modules</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-sys-module" [routerLink]="['/sys/sys-module/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.sysModule.home.createLabel">
            Create a new Sys Module
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="sysModules?.length === 0">
        <span jhiTranslate="ctApp.sysModule.home.notFound">No sysModules found</span>
    </div>
    <div class="table-responsive" *ngIf="sysModules?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="name"><span jhiTranslate="ctApp.sysModule.name">Name</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="caption"><span jhiTranslate="ctApp.sysModule.caption">Caption</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="imageUri"><span jhiTranslate="ctApp.sysModule.imageUri">Image Uri</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="sysGroupModuleId"><span jhiTranslate="ctApp.sysModule.sysGroupModule">Sys Group Module</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let sysModule of sysModules ;trackBy: trackId">
                <td><a [routerLink]="['/sys/sys-module', sysModule.id, 'view' ]">{{sysModule.id}}</a></td>
                <td>{{sysModule.name}}</td>
                <td>{{sysModule.caption}}</td>
                <td>{{sysModule.imageUri}}</td>
                <td>
                    <div *ngIf="sysModule.sysGroupModuleId">
                        <a [routerLink]="['/sys/sys-group-module', sysModule.sysGroupModuleId , 'view' ]" >{{sysModule.sysGroupModuleId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/sys-module', sysModule.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-module', sysModule.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/sys-module', { outlets: { popup: sysModule.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="sysModules?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
