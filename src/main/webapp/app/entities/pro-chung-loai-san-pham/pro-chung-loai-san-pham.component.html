<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proChungLoaiSanPham.home.title">Pro Chung Loai San Phams</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-chung-loai-san-pham" [routerLink]="['/sys/pro-chung-loai-san-pham/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proChungLoaiSanPham.home.createLabel">
            Create a new Pro Chung Loai San Pham
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proChungLoaiSanPhams?.length === 0">
        <span jhiTranslate="ctApp.proChungLoaiSanPham.home.notFound">No proChungLoaiSanPhams found</span>
    </div>
    <div class="table-responsive" *ngIf="proChungLoaiSanPhams?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="tenChungLoai"><span jhiTranslate="ctApp.proChungLoaiSanPham.tenChungLoai">Ten Chung Loai</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proChungLoaiSanPham of proChungLoaiSanPhams ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-chung-loai-san-pham', proChungLoaiSanPham.id, 'view' ]">{{proChungLoaiSanPham.id}}</a></td>
                <td>{{proChungLoaiSanPham.tenChungLoai}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-chung-loai-san-pham', proChungLoaiSanPham.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-chung-loai-san-pham', proChungLoaiSanPham.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-chung-loai-san-pham', { outlets: { popup: proChungLoaiSanPham.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="proChungLoaiSanPhams?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
