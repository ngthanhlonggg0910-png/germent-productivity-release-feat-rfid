<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-issue-cum-loi-heading" jhiTranslate="ctApp.proIssueCumLoi.home.createOrEditLabel">Create or edit a Pro Issue Cum Loi</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proIssueCumLoi.ten" for="field_ten">Ten</label>
                    <input type="text" class="form-control" name="ten" id="field_ten"
                           formControlName="ten"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proIssueCumLoi.mau" for="field_mau">Mau</label>
                    <input type="text" class="form-control" name="mau" id="field_mau"
                           formControlName="mau"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proIssueCumLoi.toTruong" for="field_toTruong">To Truong</label>
                    <input type="checkbox" class="form-control" name="toTruong" id="field_toTruong"
                           formControlName="toTruong"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proIssueCumLoi.kyThuat" for="field_kyThuat">Ky Thuat</label>
                    <input type="checkbox" class="form-control" name="kyThuat" id="field_kyThuat"
                           formControlName="kyThuat"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proIssueCumLoi.qa" for="field_qa">Qa</label>
                    <input type="checkbox" class="form-control" name="qa" id="field_qa"
                           formControlName="qa"/>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
