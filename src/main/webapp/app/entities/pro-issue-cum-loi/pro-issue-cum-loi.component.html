<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.proIssueCumLoi.home.title">Pro Issue Cum Lois</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-issue-cum-loi" [routerLink]="['/sys/pro-issue-cum-loi/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.proIssueCumLoi.home.createLabel">
            Create a new Pro Issue Cum Loi
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proIssueCumLois?.length === 0">
        <span jhiTranslate="ctApp.proIssueCumLoi.home.notFound">No proIssueCumLois found</span>
    </div>
    <div class="table-responsive" *ngIf="proIssueCumLois?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr>
            <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proIssueCumLoi.ten">Ten</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proIssueCumLoi.mau">Mau</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proIssueCumLoi.toTruong">To Truong</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proIssueCumLoi.kyThuat">Ky Thuat</span></th>
            <th scope="col" ><span jhiTranslate="ctApp.proIssueCumLoi.qa">Qa</span></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proIssueCumLoi of proIssueCumLois ;trackBy: trackId">
                <td><a [routerLink]="['/sys/pro-issue-cum-loi', proIssueCumLoi.id, 'view' ]">{{proIssueCumLoi.id}}</a></td>
                <td>{{proIssueCumLoi.ten}}</td>
                <td>{{proIssueCumLoi.mau}}</td>
                <td>{{proIssueCumLoi.toTruong}}</td>
                <td>{{proIssueCumLoi.kyThuat}}</td>
                <td>{{proIssueCumLoi.qa}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/pro-issue-cum-loi', proIssueCumLoi.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-issue-cum-loi', proIssueCumLoi.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/pro-issue-cum-loi', { outlets: { popup: proIssueCumLoi.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
