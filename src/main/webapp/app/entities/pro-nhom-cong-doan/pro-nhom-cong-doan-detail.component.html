<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="proNhomCongDoan">
            <h2><span jhiTranslate="ctApp.proNhomCongDoan.detail.title">Pro Nhom Cong Doan</span> {{proNhomCongDoan.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ctApp.proNhomCongDoan.ten">Ten</span></dt>
                <dd>
                    <span>{{proNhomCongDoan.ten}}</span>
                </dd>
                <dt><span jhiTranslate="ctApp.proNhomCongDoan.checkNangSuat">Check Nang Suat</span></dt>
                <dd>
                    <span>{{proNhomCongDoan.checkNangSuat}}</span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/sys/pro-nhom-cong-doan', proNhomCongDoan.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
