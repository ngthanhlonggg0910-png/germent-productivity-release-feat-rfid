<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-pro-ke-hoach-san-xuat-heading" jhiTranslate="ctApp.proKeHoachSanXuat.home.createOrEditLabel">Create or edit a Pro Ke Hoach San Xuat</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.ngaySanXuat" for="field_ngaySanXuat">Ngay San Xuat</label>
                    <div class="d-flex">
                        <input id="field_ngaySanXuat" type="datetime-local" class="form-control" name="ngaySanXuat" formControlName="ngaySanXuat" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.soLuongYeuCau" for="field_soLuongYeuCau">So Luong Yeu Cau</label>
                    <input type="number" class="form-control" name="soLuongYeuCau" id="field_soLuongYeuCau"
                           formControlName="soLuongYeuCau"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.tinhTrang" for="field_tinhTrang">Tinh Trang</label>
                    <input type="number" class="form-control" name="tinhTrang" id="field_tinhTrang"
                           formControlName="tinhTrang"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.ghiChu" for="field_ghiChu">Ghi Chu</label>
                    <input type="text" class="form-control" name="ghiChu" id="field_ghiChu"
                           formControlName="ghiChu"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.sam" for="field_sam">Sam</label>
                    <input type="number" class="form-control" name="sam" id="field_sam"
                           formControlName="sam"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.lotNo" for="field_lotNo">Lot No</label>
                    <input type="number" class="form-control" name="lotNo" id="field_lotNo"
                           formControlName="lotNo"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.proChuyen" for="field_proChuyen">Pro Chuyen</label>
                    <select class="form-control" id="field_proChuyen" name="proChuyen" formControlName="proChuyenId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proChuyenOption.id" *ngFor="let proChuyenOption of prochuyens; trackBy: trackProChuyenById">{{proChuyenOption.ten}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.proKeHoachSanXuat.proSanPham" for="field_proSanPham">Pro San Pham</label>
                    <select class="form-control" id="field_proSanPham" name="proSanPham" formControlName="proSanPhamId">
                        <option [ngValue]="null"></option>
                        <option [ngValue]="proSanPhamOption.id" *ngFor="let proSanPhamOption of prosanphams; trackBy: trackProSanPhamById">{{proSanPhamOption.maSanPham}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
