<div>
    <h2 id="page-heading">
        <span jhiTranslate="ctApp.khacPhucLoi.home.title">Khac Phuc Lois</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-khac-phuc-loi" [routerLink]="['/sys/khac-phuc-loi/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="ctApp.khacPhucLoi.home.createLabel">
            Create a new Khac Phuc Loi
            </span>
        </button>
    </h2>
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="khacPhucLois?.length === 0">
        <span jhiTranslate="ctApp.khacPhucLoi.home.notFound">No khacPhucLois found</span>
    </div>
    <div class="table-responsive" *ngIf="khacPhucLois?.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th scope="col"  jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="maKP"><span jhiTranslate="ctApp.khacPhucLoi.maKP">Ma KP</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="tenKP"><span jhiTranslate="ctApp.khacPhucLoi.tenKP">Ten KP</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="nguoiTao"><span jhiTranslate="ctApp.khacPhucLoi.nguoiTao">Nguoi Tao</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="ngayTao"><span jhiTranslate="ctApp.khacPhucLoi.ngayTao">Ngay Tao</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"  jhiSortBy="userId"><span jhiTranslate="ctApp.khacPhucLoi.userId">User Id</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let khacPhucLoi of khacPhucLois ;trackBy: trackId">
                <td><a [routerLink]="['/sys/khac-phuc-loi', khacPhucLoi.id, 'view' ]">{{khacPhucLoi.id}}</a></td>
                <td>{{khacPhucLoi.maKP}}</td>
                <td>{{khacPhucLoi.tenKP}}</td>
                <td>{{khacPhucLoi.nguoiTao}}</td>
                <td>{{khacPhucLoi.ngayTao}}</td>
                <td>{{khacPhucLoi.userId}}</td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/sys/khac-phuc-loi', khacPhucLoi.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/khac-phuc-loi', khacPhucLoi.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/sys/khac-phuc-loi', { outlets: { popup: khacPhucLoi.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div [hidden]="khacPhucLois?.length === 0">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
