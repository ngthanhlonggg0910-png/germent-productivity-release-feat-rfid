<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-khac-phuc-loi-heading" jhiTranslate="ctApp.khacPhucLoi.home.createOrEditLabel">Create or edit a Khac Phuc Loi</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!editForm.get('id').value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id"
                        readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.khacPhucLoi.maKP" for="field_maKP">Ma KP</label>
                    <input type="text" class="form-control" name="maKP" id="field_maKP"
                           formControlName="maKP"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.khacPhucLoi.tenKP" for="field_tenKP">Ten KP</label>
                    <input type="text" class="form-control" name="tenKP" id="field_tenKP"
                           formControlName="tenKP"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.khacPhucLoi.nguoiTao" for="field_nguoiTao">Nguoi Tao</label>
                    <input type="text" class="form-control" name="nguoiTao" id="field_nguoiTao"
                           formControlName="nguoiTao"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.khacPhucLoi.ngayTao" for="field_ngayTao">Ngay Tao</label>
                    <input type="text" class="form-control" name="ngayTao" id="field_ngayTao"
                           formControlName="ngayTao"/>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="ctApp.khacPhucLoi.userId" for="field_userId">User Id</label>
                    <input type="number" class="form-control" name="userId" id="field_userId"
                           formControlName="userId"/>
                </div>

            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
