version: '2'
services:
  ct-app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: registry.gitlab.com/nvsoft/germent-productivity
    restart: always
    depends_on:
      - ct-postgresql
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,swagger
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ct-postgresql:5432/ct
      - SPRING_DATA_JEST_URI=http://ct-elasticsearch:9200
      - SPRING_ELASTICSEARCH_REST_URIS=http://ct-elasticsearch:9200
    ports:
      - 8084:8080

  ct-postgresql:
    image: postgres:11.5
    restart: always
    volumes:
      - ~/volumes/nvsoft/ct/postgresql/:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=ct
      - POSTGRES_PASSWORD=ctpostgresql
    ports:
      - 5432:5432

  ct-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.4.3
    restart:
      always
      #volumes:
    #- ~/volumes/nvsoft/ct/elasticsearch/:/usr/share/elasticsearch/data/
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - 'ES_JAVA_OPTS=-Xms1024m -Xmx1024m'
      - 'discovery.type=single-node'
