stages:
  - build
  - package
  - release
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ./.m2/repository
  policy: pull-push

variables:
  MAVEN_OPTS: '-Xms512m -Xmx1024m'

before_script:
  - chmod +x mvnw

maven-build:
  image: maven:3-jdk-8
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ./.m2/repository
      - node_modules/
  only:
    - master
    - develop
    - milestone2
    - dev/vietlonghung
    - 01082023-tienthuan
    - 01082023
    - feat/rfid-nscl
    - release/feat-rfid
  script: 'mvn -DskipTests=true package -B'
  artifacts:
    paths:
      - target/*.jar
    
